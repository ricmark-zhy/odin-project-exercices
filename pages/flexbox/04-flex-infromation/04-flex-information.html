<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Information Exercise</title>
    <link rel="stylesheet" href="04-flex-information.css">
    <link rel="stylesheet" href="../../../css/global.css">
</head>
<body>
    <div class="global-top-nav">
        <a href="../../../index.html">Back to homepage</a>
    </div>
    <br>
    <h1>Flexbox - 04. Flex Information Exercise</h1>
    <br>
    <div class="flex-information-container">
        <div class="flex-information-title">
            <h1 id="flex-information-title">Information!</h1>
        </div>
        <div class="flex-information-cards-container">
            <div class="flex-information-cards">
                <img class="plant-images" src="images/barberry.png">
                <p class="flex-information-text">This is a type of plant. We love this one.</p>
            </div>
            <div class="flex-information-cards">
                <img class="plant-images" src="images/chilli.png">
                <p class="flex-information-text">This is another type of plant. Isn't nice?</p>
            </div>
            <div class="flex-information-cards">
                <img class="plant-images" src="images/pepper.png">
                <p class="flex-information-text">We have so many plants. Yay plants.</p>
            </div>
            <div class="flex-information-cards">
                <img src="images/saffron.png" class="plant-images">
                <p class="flex-information-text">I'm running out of things to say about plants.</p>
            </div>
        </div>
    </div>
</body>
</html>
